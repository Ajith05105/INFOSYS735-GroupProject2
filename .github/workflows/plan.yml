name: Terraform Plan

# Runs on every PR (no paths filter) because it is a required status check.
# A required check that never starts would block the PR forever.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write # needed to request the OIDC token for AWS

env:
  TF_VERSION: ${{vars.TERRAFORM_VERSION}}
  AWS_REGION: ${{secrets.AWS_REGION}}
  PLAN_ROLE_ARN: ${{secrets.PLAN_ROLE_ARN}}

# Shared with deploy.yml so only one run touches the dev state at a time
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Checks the whole repo (bootstrap, envs, modules), not just envs/dev
      - name: Terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color
