name: Terraform Deploy

# Manual only: Actions tab > Terraform Deploy > Run workflow (from main)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: 'Type "destroy" to confirm (only needed when action is destroy)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # needed to request the OIDC token for AWS

env:
  TF_VERSION: ${{ vars.TERRAFORM_VERSION }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  DEPLOY_ROLE_ARN: ${{ secrets.DEPLOY_ROLE_ARN }}

# Shared with plan.yml so only one run touches the dev state at a time
concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }} (dev)
    runs-on: ubuntu-latest
    # The deploy role only trusts main, so skip other branches up front
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Check destroy confirmation
        if: inputs.action == 'destroy' && inputs.confirm_destroy != 'destroy'
        run: |
          echo "Type destroy in the confirm_destroy box to run a destroy."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -no-color

      # Apply exactly the plan printed in this run
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform apply -input=false -no-color tfplan

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -no-color -auto-approve
